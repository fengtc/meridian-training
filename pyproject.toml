[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-training"
version = "0.1.0"
description = "可扩展的 decoder-only 语言模型训练项目"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "tokenizers>=0.19",
  "pyarrow>=15",
  "megatron-core==0.19.2",
]

[project.optional-dependencies]
templates = ["transformers>=4.45", "jinja2>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
