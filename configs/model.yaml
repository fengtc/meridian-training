name: Meridian-Base
status: PLAN_ONLY

# 模型从随机权重初始化，基础训练不加载外部 checkpoint。
vocab_size: ${TOKENIZER_VOCAB_SIZE}
parameters_target: 149500000
num_layers: 16
hidden_size: 576
num_attention_heads: 9
num_query_groups: 3
ffn_hidden_size: 1664
normalization: RMSNorm
activation: SwiGLU
position_embedding: RoPE
rotary_base: 10000
share_embeddings_and_output_weights: false
attention:
  local_window: 128
  # 从 1 开始计数，其余层使用局部窗口。
  global_layers_one_based: [4, 9, 15]
precision: bf16
sequence_length: 2048
parallelism:
  tensor_parallel: 1
  pipeline_parallel: 1
  context_parallel: 1
  data_parallel: 1
